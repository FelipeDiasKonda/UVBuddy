[versions]
agp = "8.9.2"
kotlin = "2.0.21"
playServicesWearable = "18.0.0"
wearToolingPreview = "1.0.0"
coreSplashscreen = "1.0.1"
coroutines      = "1.7.0"
lifecycle       = "2.6.1"
wear            = "1.2.0"
core-ktx        = "1.10.1"
appcompat       = "1.6.1"
retrofit        = "2.9.0"
gson            = "2.9.0"
okhttp-logging  = "4.11.0"

[libraries]
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version.ref = "wearToolingPreview" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
kotlin-stdlib           = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
coroutines-android      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx  = { module = "androidx.lifecycle:lifecycle-livedata-ktx",  version.ref = "lifecycle" }
wear                    = { module = "androidx.wear:wear",                        version.ref = "wear" }
core-ktx                = { module = "androidx.core:core-ktx",                  version.ref = "core-ktx" }
appcompat               = { module = "androidx.appcompat:appcompat",            version.ref = "appcompat" }
retrofit                = { module = "com.squareup.retrofit2:retrofit",        version.ref = "retrofit" }
converter-gson          = { module = "com.squareup.retrofit2:converter-gson",  version.ref = "gson" }
okhttp-logging          = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp-logging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

